server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Country from the edge proxy (Cloudflare, CloudFront, or X-Country-Code).
    # The SPA uses this once, on the first visit, to pick a language.
    location = /geo/country {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 200 '{"cf":"$http_cf_ipcountry","cloudfront":"$http_cloudfront_viewer_country","countryCode":"$http_x_country_code","vercel":"$http_x_vercel_ip_country"}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
