name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run generate:api
      - run: npm run build

  deploy:
    needs: build
    if: >-
      github.ref == 'refs/heads/main'
      && github.event_name == 'push'
      && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT != '' && secrets.DEPLOY_PORT || 22 }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -euo pipefail
            DEPLOY_ROOT="/opt/casino/casino-frontend"
            COMPOSE_FILE="/opt/casino/casino-backend/docker/docker-compose.prod.yml"
            if [[ ! -d "$DEPLOY_ROOT" ]]; then
              echo "Missing $DEPLOY_ROOT — complete one-time setup in casino-backend/docs/deploy-docker.md"
              exit 1
            fi
            if [[ ! -x "$DEPLOY_ROOT/scripts/deploy-docker.sh" ]]; then
              echo "Missing deploy script — run: chmod +x $DEPLOY_ROOT/scripts/deploy-docker.sh"
              exit 1
            fi
            bash "$DEPLOY_ROOT/scripts/deploy-docker.sh"
