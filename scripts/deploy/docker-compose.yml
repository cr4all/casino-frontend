# Frontend-only stack from GHCR.
# Project name is passed with `docker compose -p` (one project per design).
# A fixed name here would make `up` replace every other design's container.

services:
  frontend:
    image: ${FRONTEND_IMAGE:-casino-frontend:latest}
    container_name: ${FRONTEND_CONTAINER_NAME:-casino_prod_frontend}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8001}:80"
    networks:
      - casino-frontend
    mem_limit: 256m
    mem_reservation: 128m
    cpus: 0.25

networks:
  casino-frontend:
    driver: bridge
